# Runs the GitHub Action from the pull request's own commit against that pull request, with the
# default (pinned) agentic-ci images, and fails unless the review was posted. Renovate's agentic-ci
# image bumps run the deep review too, so a bump only goes green when both paths work.
name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'action.yml'
      - 'action/**'
      - 'skills/**'
      - 'renovate.json'
      - '.github/workflows/e2e.yml'

permissions: {}

jobs:
  review:
    name: E2E standard review
    # Fork pull requests get no secrets. Drafts are skipped by the action, which would pass
    # without posting.
    if: >-
      github.event.action != 'labeled' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    concurrency:
      group: e2e-review-${{ github.event.action != 'labeled' && github.event.pull_request.number || format('noop-{0}', github.run_id) }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    runs-on: ubuntu-latest
    # Two image pulls of up to 15 minutes each, 20 agent minutes, then the post.
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # This repository's runs go to the Red Hat MLflow through the review-telemetry relay. The
      # upload only warns on failure, so the check below stays on the summary.
      REVIEW_TELEMETRY_PROJECT: ${{ vars.REVIEW_TELEMETRY_PROJECT }}
      REVIEW_TELEMETRY_USERNAME: ${{ secrets.REVIEW_TELEMETRY_USERNAME }}
      REVIEW_TELEMETRY_TOKEN: ${{ secrets.REVIEW_TELEMETRY_TOKEN }}
    steps:
      - name: Check out the action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Note the start time
        id: start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      # A stub rules file, so the input reaches prepare and the mount end to end. The harness
      # is codex here, so the review step drops it with the documented warning.
      - name: Write a stub org rules file
        run: |
          printf 'tone_instructions: Be brief.\n' >"$RUNNER_TEMP/org-rules.yaml"

      - name: Run the action
        uses: ./
        with:
          recommend_deep_review: 'true'
          mlflow_experiment_name: ${{ vars.MLFLOW_EXPERIMENT_NAME }}
          org_review_rules: ${{ runner.temp }}/org-rules.yaml
          # The deep job below also runs on Renovate pull requests, after this one. A name no job
          # has keeps this review from standing down for it, so both paths are tested on the
          # same commit.
          deep_review_job: e2e-no-stand-down

      - name: Check that the review was posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.time }}
          # The usage line proves the telemetry reached the runner and was totalled. The direct
          # MLflow export stays off here: MLFLOW_TRACKING_URI is not set.
          EXPECT: '<sub>Usage:'
        run: .github/e2e-check-summary.sh

  deep-review:
    # The name the standard job's deep_review_job would have to match: it does not, on purpose.
    name: deep-review
    # Renovate's image bumps, and any pull request while the deep-review label is set. Both jobs
    # post as the same bot and replace each other's summary and threads, so the deep review
    # waits for the standard one to post and pass its check, or to be skipped.
    needs: review
    if: >-
      !cancelled() &&
      (needs.review.result == 'success' || needs.review.result == 'skipped') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (
        (startsWith(github.head_ref, 'renovate/') && github.event.action != 'labeled') ||
        (contains(github.event.pull_request.labels.*.name, 'deep-review') &&
          (github.event.action != 'labeled' || github.event.label.name == 'deep-review'))
      )
    concurrency:
      group: e2e-deep-review-${{ (github.event.action != 'labeled' || github.event.label.name == 'deep-review') && github.event.pull_request.number || format('noop-{0}', github.run_id) }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # This repository's runs go to the Red Hat MLflow through the review-telemetry relay. The
      # upload only warns on failure, so the check below stays on the summary.
      REVIEW_TELEMETRY_PROJECT: ${{ vars.REVIEW_TELEMETRY_PROJECT }}
      REVIEW_TELEMETRY_USERNAME: ${{ secrets.REVIEW_TELEMETRY_USERNAME }}
      REVIEW_TELEMETRY_TOKEN: ${{ secrets.REVIEW_TELEMETRY_TOKEN }}
    steps:
      - name: Check out the action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Note the start time
        id: start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - name: Run the action
        uses: ./
        with:
          mode: deep
          mlflow_experiment_name: ${{ vars.MLFLOW_EXPERIMENT_NAME }}

      - name: Check that the deep review was posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.time }}
          # One expected text per line.
          EXPECT: |
            Mode: deep
            <sub>Usage:
        run: .github/e2e-check-summary.sh
